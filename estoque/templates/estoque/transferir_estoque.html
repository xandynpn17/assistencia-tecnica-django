{% extends "core/base.html" %}

{% block title %}Transpasse de Estoque{% endblock %}

{% block header %}
<h1 class="m-0 text-dark">Transpasse de Estoque</h1>
{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="get" class="form-inline mb-3">
      <input type="text" name="q" value="{{ q }}" class="form-control mr-2" placeholder="Buscar por EAN, SKU ou descricao">
      <button type="submit" class="btn btn-primary">Buscar artigo</button>
    </form>

    <form method="post">
      {% csrf_token %}
      <div class="form-group mb-2">
        <label>Artigo</label>
        <select name="produto_id" class="form-control" required>
          <option value="">Selecione</option>
          {% for p in produtos %}
            <option value="{{ p.id }}">{{ p.nome }} | EAN {{ p.ean|default:"-" }} | SKU {{ p.sku|default:"-" }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label>Origem</label>
          <select name="origem_id" class="form-control" required>
            <option value="">Selecione</option>
            {% for po in pontos %}
              <option value="{{ po.id }}">{{ po.codigo }} - {{ po.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group col-md-4">
          <label>Destino</label>
          <select name="destino_id" class="form-control" required>
            <option value="">Selecione</option>
            {% for po in pontos %}
              <option value="{{ po.id }}">{{ po.codigo }} - {{ po.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group col-md-2">
          <label>Quantidade</label>
          <input type="number" name="quantidade" min="1" class="form-control" required>
        </div>
        <div class="form-group col-md-2">
          <label>Ubicacao (cadastro)</label>
          <select name="destino_ubicacao_id" id="destino_ubicacao_id" class="form-control">
            <option value="">Selecione</option>
            {% for u in ubicacoes %}
              <option value="{{ u.id }}" data-po="{{ u.ponto_operacional_id }}">{{ u.ponto_operacional.codigo }} - {{ u.codigo }}{% if u.descricao %} ({{ u.descricao }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label>Ubicacao destino (manual)</label>
          <input type="text" name="destino_ubicacao" class="form-control" placeholder="Ex.: Corredor A / Prat. 2">
        </div>
      </div>
      <button type="submit" class="btn btn-success">Registrar transpasse</button>
      <a href="{% url 'estoque:movimentacoes' %}" class="btn btn-secondary">Voltar</a>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", function() {
  const destinoSelect = document.querySelector("select[name='destino_id']");
  const ubicacaoSelect = document.getElementById("destino_ubicacao_id");
  if (!destinoSelect || !ubicacaoSelect) return;

  function filtrarUbicacoes() {
    const destinoId = destinoSelect.value;
    Array.from(ubicacaoSelect.options).forEach((opt) => {
      if (!opt.value) {
        opt.hidden = false;
        return;
      }
      const po = opt.getAttribute("data-po");
      opt.hidden = !!destinoId && po !== destinoId;
    });
    if (ubicacaoSelect.selectedOptions[0] && ubicacaoSelect.selectedOptions[0].hidden) {
      ubicacaoSelect.value = "";
    }
  }

  destinoSelect.addEventListener("change", filtrarUbicacoes);
  filtrarUbicacoes();
});
</script>
{% endblock %}
