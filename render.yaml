services:
  - type: web
    name: assistencia-web
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn assistencia.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: assistencia-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://assistencia-web.onrender.com
      - key: DJANGO_DB_ENGINE
        value: postgres
      - key: DJANGO_TENANT_CONTEXT_ENABLED
        value: "1"
      - key: DJANGO_SETUP_GATE_ENABLED
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DB_NAME
        fromDatabase:
          name: assistencia-db
          property: database
      - key: DJANGO_DB_USER
        fromDatabase:
          name: assistencia-db
          property: user
      - key: DJANGO_DB_PASSWORD
        fromDatabase:
          name: assistencia-db
          property: password
      - key: DJANGO_DB_HOST
        fromDatabase:
          name: assistencia-db
          property: host
      - key: DJANGO_DB_PORT
        fromDatabase:
          name: assistencia-db
          property: port

databases:
  - name: assistencia-db
    plan: free
