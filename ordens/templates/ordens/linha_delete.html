{% extends 'core/base.html' %}
{% block title %}Excluir Linha de Trabalho{% endblock %}

{% block content %}
<form id="excluir-linha-form" method="post">
    {% csrf_token %}
    <p>Tem certeza que deseja excluir a linha: "{{ linha.descricao }}"?</p>
    <div class="mt-3">
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    </div>
</form>
{% endblock %}
