<style>
  .config-hub {
    margin-bottom: 1rem;
    padding: 1rem;
    border: 1px solid #dbe6f3;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 10px 26px rgba(29, 58, 112, 0.06);
  }
  .config-hub-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: .85rem;
  }
  .config-hub-eyebrow {
    color: #2563eb;
    font-size: .74rem;
    font-weight: 800;
    letter-spacing: .07em;
    text-transform: uppercase;
  }
  .config-hub-title {
    margin: .2rem 0 .15rem;
    color: #183153;
    font-size: 1.35rem;
    font-weight: 800;
  }
  .config-hub-subtitle { margin: 0; color: #637995; font-size: .9rem; }
  .config-hub-home {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .48rem .7rem;
    border: 1px solid #dbe6f3;
    border-radius: 10px;
    color: #28476f;
    background: #f8fbff;
    font-size: .82rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .config-hub-nav {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: .55rem;
  }
  .config-hub-link {
    display: flex;
    align-items: center;
    gap: .55rem;
    min-height: 48px;
    padding: .62rem .7rem;
    border: 1px solid #e1e9f3;
    border-radius: 11px;
    background: #fbfdff;
    color: #28476f;
    text-decoration: none !important;
    font-size: .85rem;
    font-weight: 700;
  }
  .config-hub-link i { width: 1.25rem; color: #3b82f6; text-align: center; }
  .config-hub-link:hover,
  .config-hub-link.is-active { border-color: #70a7f7; background: #eff6ff; color: #1d4ed8; }
  @media (max-width: 991.98px) {
    .config-hub-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 575.98px) {
    .config-hub-head { display: block; }
    .config-hub-home { margin-top: .65rem; }
    .config-hub-nav {
      display: flex;
      overflow-x: auto;
      padding-bottom: .25rem;
      scroll-snap-type: x proximity;
    }
    .config-hub-link { min-width: 158px; scroll-snap-align: start; }
  }
</style>

<div class="config-hub">
  <div class="config-hub-head">
    <div>
      <div class="config-hub-eyebrow"><i class="fas fa-sliders-h mr-1"></i> Central de configurações</div>
      <h1 class="config-hub-title">{{ config_operacional_title|default:"Configurações da empresa" }}</h1>
      <p class="config-hub-subtitle">{{ config_operacional_subtitle|default:"Escolha uma área para alterar regras e dados da operação." }}</p>
    </div>
    <a class="config-hub-home" href="{% url 'configuracoes:painel' %}"><i class="fas fa-th-large"></i> Ver todas</a>
  </div>

  <nav class="config-hub-nav" aria-label="Áreas de configuração">
    <a href="{% url 'configuracoes:empresa' %}?secao=empresa" class="config-hub-link{% if config_operacional_tab == 'empresa' and config_secao != 'fiscal' and config_secao != 'estoque' %} is-active{% endif %}"><i class="fas fa-building"></i> Empresa</a>
    <a href="{% url 'configuracoes:empresa' %}?secao=fiscal" class="config-hub-link{% if config_operacional_tab == 'empresa' and config_secao == 'fiscal' %} is-active{% endif %}"><i class="fas fa-file-invoice-dollar"></i> Fiscal</a>
    <a href="{% url 'configuracoes:configuracao_sistema' %}?secao=atendimento" class="config-hub-link{% if config_operacional_tab == 'os' or config_secao == 'atendimento' %} is-active{% endif %}"><i class="fas fa-tools"></i> Atendimento e OS</a>
    <a href="{% url 'configuracoes:configuracao_sistema' %}?secao=estoque" class="config-hub-link{% if config_secao == 'estoque' %} is-active{% endif %}"><i class="fas fa-boxes"></i> Estoque</a>
    <a href="{% url 'configuracoes:configuracao_sistema' %}?secao=financeiro" class="config-hub-link{% if config_secao == 'financeiro' %} is-active{% endif %}"><i class="fas fa-cash-register"></i> Financeiro</a>
    <a href="{% url 'configuracoes:configuracao_sistema' %}?secao=comunicacao" class="config-hub-link{% if config_operacional_tab == 'comunicacao' or config_secao == 'comunicacao' %} is-active{% endif %}"><i class="fas fa-comments"></i> Comunicação</a>
    <a href="{% url 'configuracoes:configuracao_sistema' %}?secao=documentos" class="config-hub-link{% if config_secao == 'documentos' %} is-active{% endif %}"><i class="fas fa-file-pdf"></i> Documentos</a>
    <a href="{% url 'configuracoes:painel' %}#administracao" class="config-hub-link"><i class="fas fa-user-shield"></i> Administração</a>
  </nav>
</div>
