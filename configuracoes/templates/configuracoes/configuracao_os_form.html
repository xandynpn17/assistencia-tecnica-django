{% extends "core/base.html" %}
{% block title %}Configuração da Ordem de Serviço{% endblock %}

{% block content %}
<div class="card card-modern">
  <div class="card-modern-header">
    <i class="fas fa-tools"></i> Configuração da Ordem de Serviço
  </div>
  <div class="card-modern-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
      <a href="{% url 'configuracoes:painel' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
