{% extends "core/base.html" %}
{% block title %}Lista de Alíquotas{% endblock %}

{% block content %}
<div class="card card-modern">
  <div class="card-modern-header">
    <i class="fas fa-percentage"></i> Lista de Alíquotas
    <a href="{% url 'configuracoes:adicionar_aliquota' %}" class="btn btn-success btn-sm float-right">
      <i class="fas fa-plus"></i> Nova
    </a>
  </div>
  <div class="card-modern-body table-responsive">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Descrição</th>
          <th>Percentual</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for a in aliquotas %}
        <tr>
          <td>{{ a.descricao }}</td>
          <td>{{ a.aliquota }}%</td>
          <td>
            <a href="{% url 'configuracoes:editar_aliquota' a.id %}" class="btn btn-sm btn-warning">
              <i class="fas fa-edit"></i>
            </a>
            <a href="{% url 'configuracoes:excluir_aliquota' a.id %}" class="btn btn-sm btn-danger">
              <i class="fas fa-trash-alt"></i>
            </a>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3" class="text-center">Nenhuma alíquota cadastrada.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
